name: voice-train
# Fine-tunes the Kareem voice (Piper VITS, medium) on the owner's reading of the cards (voice/data on this branch).
# Settings in voice/train.cfg. Each run resumes from the last fine-tuned checkpoint if one is published, and publishes
# the new model (.onnx + config), its checkpoint and the log to the "voice-ft" pre-release.
on:
  push:
    branches: [voice-train]
    paths: ["voice/train.cfg"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Train
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash voice/run.sh 2>&1 | tee run.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub && cp run.log pub/ 2>/dev/null || true
          gh release view voice-ft >/dev/null 2>&1 || gh release create voice-ft --prerelease --target voice-train --title "Fine-tuned voice" --notes "Kareem fine-tuned on the owner's reading."
          gh release upload voice-ft pub/* --clobber
