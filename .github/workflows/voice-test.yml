name: Voice test

on:
  push:
    branches: [voice-test]
    paths: ["tools/voice_test/**", ".github/workflows/voice-test.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-v3
      - name: Install (CPU PyTorch + Chatterbox)
        run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts==0.1.7
      - name: Generate test sentences
        run: |
          mkdir -p tools/voice_test/out
          set -o pipefail
          python tools/voice_test/run.py 2>&1 | tee tools/voice_test/out/run.log
      - name: Save samples and log to this branch
        if: always()
        run: |
          git config user.name "voice-test-bot"
          git config user.email "noreply@github.com"
          git add tools/voice_test/out
          git commit -m "Voice test samples (Chatterbox Multilingual, run ${{ github.run_number }})" || echo "nothing to commit"
          git push
