name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch verse recitations and Uthmani text
        run: python3 tools/fetch_quran.py app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Re-Iman-0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Re-Iman — نسخة ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK on your phone and install it." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Re-Iman-apk
          path: Re-Iman-*.apk
