name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch verse recitations and Uthmani text
        run: python3 tools/fetch_quran.py app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Job logs are not always reachable, so a failed build pushes its errors to the build-logs branch.
      - name: Push the build errors to the build-logs branch
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          grep -E "^e: |^w: .*error|error:|What went wrong|FAILED|Exception|AAPT|Lint found" "$RUNNER_TEMP/gradle.log" | head -150 > "$RUNNER_TEMP/log/errors.txt" || true
          tail -250 "$RUNNER_TEMP/gradle.log" > "$RUNNER_TEMP/log/tail.txt" || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rq --cached . && rm -rf -- * .github
          cp "$RUNNER_TEMP"/log/* . && git add errors.txt tail.txt
          git commit -qm "Build errors of ${GITHUB_SHA::7}" && git push -qf origin build-logs

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Re-Iman-0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Re-Iman — نسخة ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK on your phone and install it." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Re-Iman-apk
          path: Re-Iman-*.apk
