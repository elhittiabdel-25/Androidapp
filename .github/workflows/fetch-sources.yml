name: fetch-sources
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the book files and the Quran text
        run: |
          mkdir -p sources/raw
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          : > sources/raw/log.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            if curl -fsSL --retry 3 -A "$UA" -o "sources/raw/$name" "$url"; then
              echo "ok $name $(stat -c %s sources/raw/$name)" >> sources/raw/log.txt
            else
              echo "FAILED $name" >> sources/raw/log.txt
            fi
          done < sources/list.txt
          cat sources/raw/log.txt
      - name: Commit the files to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sources/raw
          git commit -m "Fetched source files" || echo "nothing to commit"
          git push
