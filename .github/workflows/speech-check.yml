name: Speech check

# Transcribes the app's voice clips with Whisper and compares them with the text they should say.
# The report is pushed to the "checks" branch (reports/speech-check.txt), since job logs are not always reachable.
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/audio/**"
      - "tools/tts/speech.json"
      - "tools/tts/speech_check.py"
      - ".github/workflows/speech-check.yml"
  workflow_dispatch:
    inputs:
      cards:
        description: "Card ids to check, comma-separated (empty = all cards)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A push checks only the cards whose clips it changed; a manual run checks the cards given (or all).
      - name: Cards to check
        id: which
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ inputs.cards }}
        run: |
          ids="$INPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ids=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- app/src/main/assets/audio | cut -d/ -f6 | sort -u | paste -sd, -)
          fi
          echo "cards: ${ids:-all}"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download the speech engine and Whisper-small
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.20/sherpa-onnx-v1.12.20-linux-x64-static.tar.bz2 | tar xj
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2 \
            | tar xj --exclude='*/small-encoder.onnx' --exclude='*/small-decoder.onnx'
          ls

      - name: Transcribe and score
        run: |
          python3 tools/tts/speech_check.py "$RUNNER_TEMP/tools" "$RUNNER_TEMP/out" "${{ steps.which.outputs.ids }}" 2>&1 | tee "$RUNNER_TEMP/out-log.txt"

      - name: Push the report to the checks branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          cp "$RUNNER_TEMP"/out/speech-check.* "$RUNNER_TEMP/report/" 2>/dev/null || true
          cp "$RUNNER_TEMP/out-log.txt" "$RUNNER_TEMP/report/run.log" 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan checks
          git rm -rq --cached . && rm -rf -- * .github
          mkdir reports && cp "$RUNNER_TEMP"/report/* reports/
          echo "Speech check of ${GITHUB_SHA::7}" > reports/README.md
          git add reports && git commit -qm "Speech check of ${GITHUB_SHA::7}"
          git push -qf origin checks
