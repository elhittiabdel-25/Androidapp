name: voice-kaggle
# Runs the voice fine-tuning on a Kaggle GPU (the owner's Kaggle account, through its API token in the
# KAGGLE_JSON secret). start: uploads voice/data + scripts as the private dataset <user>/reiman-voice and pushes the
# private GPU notebook <user>/reiman-voice-train (it runs on Kaggle, up to 12 h, no Actions minutes).
# status: prints the notebook's state. fetch: downloads its outputs and publishes the .onnx files to "voice-ft".
on:
  workflow_dispatch:
    inputs:
      action:
        description: "start | status | fetch"
        required: true
        default: status
permissions:
  contents: write
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kaggle CLI
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          [ -n "$KAGGLE_JSON" ] || { echo "KAGGLE_JSON secret missing"; exit 1; }
          mkdir -p ~/.kaggle && printf '%s' "$KAGGLE_JSON" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
          pip install -q kaggle
          echo "KU=$(python -c "import json,os;print(json.load(open(os.path.expanduser('~/.kaggle/kaggle.json')))['username'])")" >> $GITHUB_ENV
      - name: Start
        if: inputs.action == 'start'
        run: |
          set -x
          mkdir -p ds nb && cp -r voice/data voice/prep.py voice/run_kaggle.sh ds/
          printf '{"title":"reiman-voice","id":"%s/reiman-voice","licenses":[{"name":"other"}]}' "$KU" > ds/dataset-metadata.json
          kaggle datasets create -p ds --dir-mode zip -q || kaggle datasets version -p ds --dir-mode zip -m "update" -q || exit 1
          for i in $(seq 1 40); do s=$(kaggle datasets status "$KU/reiman-voice"); echo "$s"; [ "$s" = "ready" ] && break; sleep 15; done
          python - <<'P'
          import json, os
          ku = os.environ["KU"]
          src = ["!bash $(find /kaggle/input -name run_kaggle.sh | head -1) 2>&1 | tee /kaggle/working/train.log | "
                 "grep -E --line-buffered 'torch|start epoch|utterances|Epoch [0-9]+:.*100%|stage|DONE|Error|error'"]
          nb = {"cells": [{"cell_type": "code", "execution_count": None, "metadata": {}, "outputs": [], "source": src}],
                "metadata": {"kernelspec": {"display_name": "Python 3", "language": "python", "name": "python3"}},
                "nbformat": 4, "nbformat_minor": 4}
          json.dump(nb, open("nb/train.ipynb", "w"))
          json.dump({"id": f"{ku}/reiman-voice-train", "title": "reiman-voice-train", "code_file": "train.ipynb",
                     "language": "python", "kernel_type": "notebook", "is_private": True, "enable_gpu": True,
                     "enable_internet": True, "dataset_sources": [f"{ku}/reiman-voice"], "competition_sources": [],
                     "kernel_sources": []}, open("nb/kernel-metadata.json", "w"))
          P
          kaggle kernels push -p nb
      - name: Status
        if: inputs.action != 'fetch'
        run: kaggle kernels status "$KU/reiman-voice-train" || true
      - name: Fetch
        if: inputs.action == 'fetch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kaggle kernels status "$KU/reiman-voice-train"
          mkdir -p out && kaggle kernels output "$KU/reiman-voice-train" -p out
          ls -la out; tail -40 out/train.log 2>/dev/null | cut -c1-200
          gh release view voice-ft >/dev/null 2>&1 || gh release create voice-ft --prerelease --target voice-train --title "Fine-tuned voice" --notes "Kareem fine-tuned on the reader."
          for f in out/*.onnx out/*.onnx.json out/train.log; do [ -f "$f" ] && gh release upload voice-ft "$f" --clobber; done; true
