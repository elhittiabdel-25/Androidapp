# voice-train settings (bash). Push a change to this file to start a run.
EPOCHS=40       # epochs to add this run (about 3.5 minutes each on the CPU runner)
BATCH=8
MINUTES=150     # hard stop for training (the job then exports what it has); run 8: clips lowered to Kareem's pitch
RESUME=0        # 1 = continue from the last fine-tuned checkpoint in the voice-ft release
